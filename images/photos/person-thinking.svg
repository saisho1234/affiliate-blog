<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="'Hiragino Sans','Yu Gothic',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f4ff"/>
      <stop offset="100%" style="stop-color:#e8f5e9"/>
    </linearGradient>
    <linearGradient id="desk" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8d6e63"/>
      <stop offset="100%" style="stop-color:#6d4c41"/>
    </linearGradient>
  </defs>
  <!-- 背景 -->
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- 窓 -->
  <rect x="580" y="30" width="160" height="200" rx="8" fill="#b3d9f7" stroke="#90c0e8" stroke-width="2"/>
  <line x1="660" y1="30" x2="660" y2="230" stroke="#90c0e8" stroke-width="2"/>
  <line x1="580" y1="130" x2="740" y2="130" stroke="#90c0e8" stroke-width="2"/>
  <!-- 壁 -->
  <rect x="0" y="280" width="800" height="120" fill="#efebe9"/>
  <!-- 机 -->
  <rect x="100" y="265" width="600" height="20" rx="4" fill="url(#desk)"/>
  <!-- ノートPC -->
  <rect x="340" y="200" width="200" height="65" rx="6" fill="#37474f"/>
  <rect x="346" y="206" width="188" height="52" rx="4" fill="#263238"/>
  <!-- スクリーン内容（簡略） -->
  <rect x="356" y="214" width="140" height="6" rx="2" fill="#4fc3f7" opacity="0.8"/>
  <rect x="356" y="224" width="100" height="5" rx="2" fill="#b0bec5" opacity="0.6"/>
  <rect x="356" y="233" width="120" height="5" rx="2" fill="#b0bec5" opacity="0.6"/>
  <rect x="356" y="242" width="80" height="5" rx="2" fill="#b0bec5" opacity="0.6"/>
  <!-- PC台 -->
  <rect x="420" y="265" width="40" height="4" rx="2" fill="#546e7a"/>
  <!-- コーヒーカップ -->
  <ellipse cx="200" cy="265" rx="22" ry="8" fill="#795548"/>
  <rect x="178" y="230" width="44" height="35" rx="4" fill="#8d6e63"/>
  <ellipse cx="200" cy="230" rx="22" ry="6" fill="#a1887f"/>
  <!-- 人物（思考中） -->
  <!-- 体 -->
  <rect x="230" y="180" width="80" height="90" rx="20" fill="#ffccbc"/>
  <!-- 頭 -->
  <circle cx="270" cy="155" r="38" fill="#ffccbc"/>
  <!-- 髪 -->
  <ellipse cx="270" cy="128" rx="38" ry="16" fill="#4e342e"/>
  <rect x="232" y="128" width="10" height="30" rx="5" fill="#4e342e"/>
  <rect x="296" y="128" width="10" height="30" rx="5" fill="#4e342e"/>
  <!-- 目（考え中 - 少し上を向く） -->
  <ellipse cx="256" cy="152" rx="6" ry="5" fill="white"/>
  <ellipse cx="284" cy="152" rx="6" ry="5" fill="white"/>
  <circle cx="257" cy="150" r="3" fill="#333"/>
  <circle cx="285" cy="150" r="3" fill="#333"/>
  <!-- 口（考え中） -->
  <path d="M260,168 Q270,165 280,168" stroke="#e64a19" stroke-width="2" fill="none"/>
  <!-- 思考バブル -->
  <circle cx="330" cy="100" r="6" fill="white" opacity="0.7"/>
  <circle cx="348" cy="82" r="10" fill="white" opacity="0.8"/>
  <circle cx="375" cy="60" r="18" fill="white" opacity="0.9"/>
  <text x="375" y="56" text-anchor="middle" fill="#2563eb" font-size="14" font-weight="bold">AI</text>
  <text x="375" y="72" text-anchor="middle" fill="#7c3aed" font-size="10">検討中...</text>
  <!-- 腕（頬に手を当てる） -->
  <path d="M232,200 Q210,215 215,240" stroke="#ffccbc" stroke-width="16" fill="none" stroke-linecap="round"/>
  <circle cx="215" cy="155" r="12" fill="#ffccbc"/>
  <!-- ラベル -->
  <text x="400" y="370" text-anchor="middle" fill="#94a3b8" font-size="12">AIツールを検討・レビュー中のユーザーイメージ | AI navi</text>
</svg>
