<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <rect width="800" height="470" fill="#f8fafc" rx="16"/>
  <rect x="0" y="0" width="800" height="72" fill="#2563eb" rx="16"/>
  <rect x="0" y="56" width="800" height="16" fill="#2563eb"/>
  <text x="400" y="45" text-anchor="middle" fill="white" font-size="22" font-weight="bold">ChatGPTで画像を作る4ステップ</text>

  <!-- Step 1 -->
  <rect x="24" y="96" width="176" height="230" fill="white" rx="12" stroke="#dbeafe" stroke-width="2"/>
  <circle cx="112" cy="134" r="24" fill="#2563eb"/>
  <text x="112" y="141" text-anchor="middle" fill="white" font-size="20" font-weight="bold">1</text>
  <text x="112" y="184" text-anchor="middle" fill="#1e293b" font-size="16" font-weight="bold">ログイン</text>
  <text x="112" y="214" text-anchor="middle" fill="#64748b" font-size="12">chatgpt.com か</text>
  <text x="112" y="232" text-anchor="middle" fill="#64748b" font-size="12">公式アプリを開く</text>
  <text x="112" y="262" text-anchor="middle" fill="#64748b" font-size="12">無料アカウントでも</text>
  <text x="112" y="280" text-anchor="middle" fill="#64748b" font-size="12">画像生成は使える</text>

  <text x="212" y="218" text-anchor="middle" fill="#94a3b8" font-size="22" font-weight="bold">›</text>

  <!-- Step 2 -->
  <rect x="224" y="96" width="176" height="230" fill="white" rx="12" stroke="#dbeafe" stroke-width="2"/>
  <circle cx="312" cy="134" r="24" fill="#7c3aed"/>
  <text x="312" y="141" text-anchor="middle" fill="white" font-size="20" font-weight="bold">2</text>
  <text x="312" y="184" text-anchor="middle" fill="#1e293b" font-size="16" font-weight="bold">指示を入力</text>
  <text x="312" y="214" text-anchor="middle" fill="#64748b" font-size="12">「〜の画像を作って」</text>
  <text x="312" y="232" text-anchor="middle" fill="#64748b" font-size="12">と日本語で書くだけ</text>
  <text x="312" y="262" text-anchor="middle" fill="#64748b" font-size="12">サイドバーの</text>
  <text x="312" y="280" text-anchor="middle" fill="#64748b" font-size="12">「画像」から型も選べる</text>

  <text x="412" y="218" text-anchor="middle" fill="#94a3b8" font-size="22" font-weight="bold">›</text>

  <!-- Step 3 -->
  <rect x="424" y="96" width="176" height="230" fill="white" rx="12" stroke="#dbeafe" stroke-width="2"/>
  <circle cx="512" cy="134" r="24" fill="#0891b2"/>
  <text x="512" y="141" text-anchor="middle" fill="white" font-size="20" font-weight="bold">3</text>
  <text x="512" y="184" text-anchor="middle" fill="#1e293b" font-size="16" font-weight="bold">直して詰める</text>
  <text x="512" y="214" text-anchor="middle" fill="#64748b" font-size="12">「背景を白に」など</text>
  <text x="512" y="232" text-anchor="middle" fill="#64748b" font-size="12">会話で追加修正</text>
  <text x="512" y="262" text-anchor="middle" fill="#64748b" font-size="12">範囲選択ツールで</text>
  <text x="512" y="280" text-anchor="middle" fill="#64748b" font-size="12">一部だけ描き直し</text>

  <text x="612" y="218" text-anchor="middle" fill="#94a3b8" font-size="22" font-weight="bold">›</text>

  <!-- Step 4 -->
  <rect x="624" y="96" width="152" height="230" fill="#fff7ed" rx="12" stroke="#f97316" stroke-width="2"/>
  <circle cx="700" cy="134" r="24" fill="#f97316"/>
  <text x="700" y="141" text-anchor="middle" fill="white" font-size="20" font-weight="bold">4</text>
  <text x="700" y="184" text-anchor="middle" fill="#1e293b" font-size="16" font-weight="bold">保存する</text>
  <text x="700" y="214" text-anchor="middle" fill="#64748b" font-size="12">画像の保存ボタンで</text>
  <text x="700" y="232" text-anchor="middle" fill="#64748b" font-size="12">端末にダウンロード</text>
  <text x="700" y="262" text-anchor="middle" fill="#64748b" font-size="12">作った画像は</text>
  <text x="700" y="280" text-anchor="middle" fill="#64748b" font-size="12">「画像」に自動保存</text>

  <!-- 注意帯 -->
  <rect x="24" y="346" width="752" height="78" fill="#fef3c7" rx="12" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="44" y="374" fill="#92400e" font-size="14" font-weight="bold">無料版の注意</text>
  <text x="44" y="398" fill="#78350f" font-size="13">画像生成には会話とは別の利用上限がある（回数は非公開・変動）。</text>
  <text x="44" y="416" fill="#78350f" font-size="13">上限に達したら時間をおくか、Plus（月3,000円前後）で上限を引き上げる。</text>

  <text x="400" y="452" text-anchor="middle" fill="#94a3b8" font-size="11">AI navi (ai-navi.app) | 2026年11月時点の情報</text>
</svg>
