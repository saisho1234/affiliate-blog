<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 728" width="800" height="728" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
<rect width="800" height="728" fill="#f8fafc" rx="16"/>
<rect x="0" y="0" width="800" height="84" fill="#2563eb" rx="16"/><rect x="0" y="68" width="800" height="16" fill="#2563eb"/>
<text x="400" y="52" text-anchor="middle" fill="white" font-size="32" font-weight="bold">DeepLの使い方 4パターン</text>
<rect x="28" y="108" width="744" height="146" fill="white" rx="12" stroke="#dbeafe" stroke-width="2"/>
<circle cx="75" cy="181" r="28" fill="#2563eb"/>
<text x="75" y="191" text-anchor="middle" fill="white" font-size="28" font-weight="bold">1</text>
<text x="122" y="160" fill="#1e293b" font-size="28" font-weight="bold">Webブラウザで翻訳</text>
<text x="122" y="194" fill="#475569" font-size="24">deepl.comに貼り付けるだけ。</text>
<text x="122" y="228" fill="#475569" font-size="24">訳語はクリックで代替表現に変更できる</text>
<rect x="28" y="268" width="744" height="112" fill="white" rx="12" stroke="#dbeafe" stroke-width="2"/>
<circle cx="75" cy="324" r="28" fill="#2563eb"/>
<text x="75" y="334" text-anchor="middle" fill="white" font-size="28" font-weight="bold">2</text>
<text x="122" y="320" fill="#1e293b" font-size="28" font-weight="bold">デスクトップアプリ</text>
<text x="122" y="354" fill="#475569" font-size="24">Ctrl+C+C などのショートカットでどこからでも翻訳</text>
<rect x="28" y="394" width="744" height="146" fill="white" rx="12" stroke="#dbeafe" stroke-width="2"/>
<circle cx="75" cy="467" r="28" fill="#2563eb"/>
<text x="75" y="477" text-anchor="middle" fill="white" font-size="28" font-weight="bold">3</text>
<text x="122" y="446" fill="#1e293b" font-size="28" font-weight="bold">ファイルをまるごと翻訳</text>
<text x="122" y="480" fill="#475569" font-size="24">Word・PowerPoint・PDFを</text>
<text x="122" y="514" fill="#475569" font-size="24">書式を保ったまま翻訳（Pro版推奨）</text>
<rect x="28" y="554" width="744" height="112" fill="white" rx="12" stroke="#dbeafe" stroke-width="2"/>
<circle cx="75" cy="610" r="28" fill="#2563eb"/>
<text x="75" y="620" text-anchor="middle" fill="white" font-size="28" font-weight="bold">4</text>
<text x="122" y="606" fill="#1e293b" font-size="28" font-weight="bold">用語集（グロッサリー）</text>
<text x="122" y="640" fill="#475569" font-size="24">専門用語・固有名詞を登録して訳語を統一</text>
<text x="400" y="704" text-anchor="middle" fill="#94a3b8" font-size="24">AI navi (ai-navi.app)｜記事本文の内容をもとに作成</text>
