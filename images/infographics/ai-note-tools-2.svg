<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 660" width="800" height="660" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
<rect width="800" height="660" fill="#f8fafc" rx="16"/>
<rect x="0" y="0" width="800" height="84" fill="#4f46e5" rx="16"/><rect x="0" y="68" width="800" height="16" fill="#4f46e5"/>
<text x="400" y="52" text-anchor="middle" fill="white" font-size="32" font-weight="bold">NotebookLMの使い方 4ステップ</text>
<rect x="28" y="108" width="744" height="112" fill="white" rx="12" stroke="#e0e7ff" stroke-width="2"/>
<circle cx="75" cy="164" r="28" fill="#4f46e5"/>
<text x="75" y="174" text-anchor="middle" fill="white" font-size="28" font-weight="bold">1</text>
<text x="122" y="160" fill="#1e293b" font-size="28" font-weight="bold">Googleアカウントでログイン</text>
<text x="122" y="194" fill="#475569" font-size="24">notebooklm.google.com にアクセス</text>
<rect x="28" y="234" width="744" height="112" fill="white" rx="12" stroke="#e0e7ff" stroke-width="2"/>
<circle cx="75" cy="290" r="28" fill="#4f46e5"/>
<text x="75" y="300" text-anchor="middle" fill="white" font-size="28" font-weight="bold">2</text>
<text x="122" y="286" fill="#1e293b" font-size="28" font-weight="bold">新しいノートブックを作成</text>
<text x="122" y="320" fill="#475569" font-size="24">PDFや記事URLをアップロード</text>
<rect x="28" y="360" width="744" height="112" fill="white" rx="12" stroke="#e0e7ff" stroke-width="2"/>
<circle cx="75" cy="416" r="28" fill="#4f46e5"/>
<text x="75" y="426" text-anchor="middle" fill="white" font-size="28" font-weight="bold">3</text>
<text x="122" y="412" fill="#1e293b" font-size="28" font-weight="bold">チャット欄で質問する</text>
<text x="122" y="446" fill="#475569" font-size="24">「この資料の要点を教えて」など</text>
<rect x="28" y="486" width="744" height="112" fill="white" rx="12" stroke="#e0e7ff" stroke-width="2"/>
<circle cx="75" cy="542" r="28" fill="#4f46e5"/>
<text x="75" y="552" text-anchor="middle" fill="white" font-size="28" font-weight="bold">4</text>
<text x="122" y="538" fill="#1e293b" font-size="28" font-weight="bold">資料の内容だけを参照して回答</text>
<text x="122" y="572" fill="#475569" font-size="24">出典の該当箇所も表示される</text>
<text x="400" y="636" text-anchor="middle" fill="#94a3b8" font-size="24">AI navi (ai-navi.app)｜記事本文の内容をもとに作成</text>
</svg>
