<rect x="0" y="0" width="800" height="84" fill="#0891b2" rx="16"/><rect x="0" y="68" width="800" height="16" fill="#0891b2"/>
<text x="400" y="52" text-anchor="middle" fill="white" font-size="32" font-weight="bold">購入前に知っておきたい3つのQ&amp;A</text>
<rect x="28" y="108" width="744" height="112" fill="white" rx="12" stroke="#cffafe" stroke-width="2"/>
<text x="52" y="160" fill="#1e293b" font-size="28" font-weight="bold">Q. バッテリーが切れたら？</text>
<text x="52" y="194" fill="#475569" font-size="24">A. USB-Cケーブルをつなげば有線モードで使えるモデルが多い</text>
<rect x="28" y="234" width="744" height="112" fill="white" rx="12" stroke="#cffafe" stroke-width="2"/>
<text x="52" y="286" fill="#1e293b" font-size="28" font-weight="bold">Q. Teams認証・Zoom認証は必要？</text>
<text x="52" y="320" fill="#475569" font-size="24">A. なくても通話はできる。毎日使うなら認証済みモデルが便利</text>
<rect x="28" y="360" width="744" height="146" fill="white" rx="12" stroke="#cffafe" stroke-width="2"/>
<text x="52" y="412" fill="#1e293b" font-size="28" font-weight="bold">Q. イヤーパッドの寿命は？</text>
<text x="52" y="446" fill="#475569" font-size="24">A. 合成レザーは1〜2年で劣化。</text>
