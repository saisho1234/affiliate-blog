<text x="454" y="334" fill="#1e293b" font-size="24">設定や用語集は</text>
<text x="454" y="368" fill="#1e293b" font-size="24">使えなくなる</text>
<rect x="28" y="430" width="744" height="58" fill="#fff7ed" rx="12" stroke="#f97316" stroke-width="2"/>
<text x="400" y="466" text-anchor="middle" fill="#9a3412" font-size="24" font-weight="bold">アプリの削除・ログアウトはどちらにもならない</text>
<text x="400" y="528" text-anchor="middle" fill="#94a3b8" font-size="24">AI navi (ai-navi.app)｜記事本文の内容をもとに作成</text>
