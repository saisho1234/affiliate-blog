<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1054" width="800" height="1054" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
<rect width="800" height="1054" fill="#f8fafc" rx="16"/>
<rect x="0" y="0" width="800" height="84" fill="#2563eb" rx="16"/><rect x="0" y="68" width="800" height="16" fill="#2563eb"/>
<text x="400" y="52" text-anchor="middle" fill="white" font-size="32" font-weight="bold">解約できないときの6つのチェック</text>
