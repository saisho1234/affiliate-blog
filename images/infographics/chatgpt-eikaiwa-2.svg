<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" width="800" height="430" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <rect width="800" height="430" fill="#f8fafc" rx="16"/>
  <rect x="0" y="0" width="800" height="72" fill="#334155" rx="16"/>
  <rect x="0" y="56" width="800" height="16" fill="#334155"/>
  <text x="400" y="45" text-anchor="middle" fill="white" font-size="22" font-weight="bold">ChatGPTと英会話専用アプリ どっちが向く？</text>

  <rect x="28" y="92" width="360" height="290" fill="white" rx="12" stroke="#99f6e4" stroke-width="2"/>
  <rect x="28" y="92" width="360" height="42" fill="#0d9488" rx="12"/>
  <rect x="28" y="118" width="360" height="16" fill="#0d9488"/>
  <text x="208" y="120" text-anchor="middle" fill="white" font-size="16" font-weight="bold">ChatGPTが向く人</text>
  <text x="52" y="170" fill="#1e293b" font-size="14">✓ 話す場面を自分で決めたい</text>
  <text x="52" y="204" fill="#1e293b" font-size="14">✓ 仕事・面接など独自の想定で練習</text>
  <text x="52" y="238" fill="#1e293b" font-size="14">✓ プロンプトを工夫するのが苦にならない</text>
  <text x="52" y="272" fill="#1e293b" font-size="14">✓ すでにChatGPTを使っている</text>
  <text x="52" y="306" fill="#1e293b" font-size="14">✓ 中級以上で「話す量」を増やしたい</text>
  <text x="52" y="356" fill="#0f766e" font-size="13" font-weight="bold">費用：無料〜Plus（月3,000円前後）</text>

  <rect x="412" y="92" width="360" height="290" fill="white" rx="12" stroke="#fed7aa" stroke-width="2"/>
  <rect x="412" y="92" width="360" height="42" fill="#f97316" rx="12"/>
  <rect x="412" y="118" width="360" height="16" fill="#f97316"/>
  <text x="592" y="120" text-anchor="middle" fill="white" font-size="16" font-weight="bold">専用アプリが向く人</text>
  <text x="436" y="170" fill="#1e293b" font-size="14">✓ 何を話すか考えるのが負担</text>
  <text x="436" y="204" fill="#1e293b" font-size="14">✓ レベル別のカリキュラムがほしい</text>
  <text x="436" y="238" fill="#1e293b" font-size="14">✓ 発音を細かくチェックしたい</text>
  <text x="436" y="272" fill="#1e293b" font-size="14">✓ 学習記録や連続日数で続けたい</text>
  <text x="436" y="306" fill="#1e293b" font-size="14">✓ 初級で基本フレーズから固めたい</text>
  <text x="436" y="356" fill="#c2410c" font-size="13" font-weight="bold">例：スピーク・Talkful など</text>

  <text x="400" y="412" text-anchor="middle" fill="#94a3b8" font-size="11">AI navi (ai-navi.app) | 2026年11月時点</text>
</svg>
