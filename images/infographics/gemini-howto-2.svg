<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <rect width="800" height="440" fill="#f8fafc" rx="16"/>
  <rect x="0" y="0" width="800" height="72" fill="#059669" rx="16"/>
  <rect x="0" y="56" width="800" height="16" fill="#059669"/>
  <text x="400" y="45" text-anchor="middle" fill="white" font-size="22" font-weight="bold">Gemini 無料版とGoogle AI Proの違い（早見）</text>

  <!-- header row -->
  <rect x="24" y="90" width="752" height="44" fill="#e2e8f0" rx="8"/>
  <text x="130" y="118" text-anchor="middle" fill="#1e293b" font-size="14" font-weight="bold">項目</text>
  <text x="400" y="118" text-anchor="middle" fill="#1e293b" font-size="14" font-weight="bold">無料版</text>
  <text x="640" y="118" text-anchor="middle" fill="#059669" font-size="14" font-weight="bold">Google AI Pro</text>

  <!-- rows -->
  <rect x="24" y="140" width="752" height="44" fill="white" rx="8" stroke="#e2e8f0"/>
  <text x="130" y="167" text-anchor="middle" fill="#334155" font-size="13" font-weight="bold">月額</text>
  <text x="400" y="167" text-anchor="middle" fill="#334155" font-size="13">0円</text>
  <text x="640" y="167" text-anchor="middle" fill="#334155" font-size="13">2,900円</text>

  <rect x="24" y="190" width="752" height="44" fill="white" rx="8" stroke="#e2e8f0"/>
  <text x="130" y="217" text-anchor="middle" fill="#334155" font-size="13" font-weight="bold">使用量の上限</text>
  <text x="400" y="217" text-anchor="middle" fill="#334155" font-size="13">標準（5時間ごとにリセット）</text>
  <text x="640" y="217" text-anchor="middle" fill="#334155" font-size="13">無料版の4倍</text>

  <rect x="24" y="240" width="752" height="44" fill="white" rx="8" stroke="#e2e8f0"/>
  <text x="130" y="267" text-anchor="middle" fill="#334155" font-size="13" font-weight="bold">一度に扱える量</text>
  <text x="400" y="267" text-anchor="middle" fill="#334155" font-size="13">3.2万トークン</text>
  <text x="640" y="267" text-anchor="middle" fill="#334155" font-size="13">100万トークン</text>

  <rect x="24" y="290" width="752" height="44" fill="white" rx="8" stroke="#e2e8f0"/>
  <text x="130" y="317" text-anchor="middle" fill="#334155" font-size="13" font-weight="bold">Gmail・ドキュメント内</text>
  <text x="400" y="317" text-anchor="middle" fill="#64748b" font-size="13">アプリ側から連携して検索・要約</text>
  <text x="640" y="317" text-anchor="middle" fill="#334155" font-size="13">各画面のGeminiが使える</text>

  <rect x="24" y="340" width="752" height="44" fill="white" rx="8" stroke="#e2e8f0"/>
  <text x="130" y="367" text-anchor="middle" fill="#334155" font-size="13" font-weight="bold">ストレージ</text>
  <text x="400" y="367" text-anchor="middle" fill="#334155" font-size="13">15GB</text>
  <text x="640" y="367" text-anchor="middle" fill="#334155" font-size="13">5TB</text>

  <text x="400" y="410" text-anchor="middle" fill="#475569" font-size="12">中間に Google AI Plus（上限は無料版の2倍）もある。料金はキャンペーンで変わるため公式で確認</text>
  <text x="400" y="430" text-anchor="middle" fill="#94a3b8" font-size="11">AI navi (ai-navi.app) | 2026年11月時点・Google公式情報より</text>
</svg>
