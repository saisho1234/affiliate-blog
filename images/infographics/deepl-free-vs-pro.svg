<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="'Hiragino Sans','Yu Gothic',sans-serif">
  <!-- 背景 -->
  <rect width="800" height="400" fill="#f8fafc" rx="16"/>
  <!-- タイトル -->
  <rect x="0" y="0" width="800" height="64" fill="#1e3a8a" rx="16"/>
  <rect x="0" y="48" width="800" height="16" fill="#1e3a8a"/>
  <text x="400" y="40" text-anchor="middle" fill="white" font-size="20" font-weight="bold">DeepL 無料版 vs Pro 徹底比較</text>

  <!-- 左: 無料版 -->
  <rect x="20" y="80" width="360" height="300" fill="white" rx="12" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="20" y="80" width="360" height="50" fill="#64748b" rx="12"/>
  <rect x="20" y="112" width="360" height="18" fill="#64748b"/>
  <text x="200" y="112" text-anchor="middle" fill="white" font-size="18" font-weight="bold">DeepL 無料版</text>
  <text x="200" y="130" text-anchor="middle" fill="#e2e8f0" font-size="13">¥0 / 月</text>

  <!-- 無料版項目 -->
  <text x="50" y="165" fill="#1e293b" font-size="13" font-weight="bold">テキスト翻訳</text>
  <text x="50" y="183" fill="#ef4444" font-size="12">✗ 1回1,500文字まで</text>
  <line x1="40" y1="195" x2="370" y2="195" stroke="#e2e8f0" stroke-width="1"/>

  <text x="50" y="215" fill="#1e293b" font-size="13" font-weight="bold">ファイル翻訳</text>
  <text x="50" y="233" fill="#ef4444" font-size="12">✗ 月3ファイルまで</text>
  <line x1="40" y1="245" x2="370" y2="245" stroke="#e2e8f0" stroke-width="1"/>

  <text x="50" y="265" fill="#1e293b" font-size="13" font-weight="bold">データプライバシー</text>
  <text x="50" y="283" fill="#ef4444" font-size="12">✗ 品質改善に利用される場合あり</text>
  <line x1="40" y1="295" x2="370" y2="295" stroke="#e2e8f0" stroke-width="1"/>

  <text x="50" y="315" fill="#1e293b" font-size="13" font-weight="bold">用語集（専門用語統一）</text>
  <text x="50" y="333" fill="#ef4444" font-size="12">✗ 1件のみ</text>
  <line x1="40" y1="345" x2="370" y2="345" stroke="#e2e8f0" stroke-width="1"/>

  <text x="50" y="365" fill="#64748b" font-size="12">→ 制限を超えるとエラーが出る</text>

  <!-- 右: Pro版 -->
  <rect x="420" y="80" width="360" height="300" fill="white" rx="12" stroke="#f97316" stroke-width="2"/>
  <rect x="420" y="80" width="360" height="50" fill="#f97316" rx="12"/>
  <rect x="420" y="112" width="360" height="18" fill="#f97316"/>
  <text x="600" y="112" text-anchor="middle" fill="white" font-size="18" font-weight="bold">DeepL Pro（Starter）</text>
  <text x="600" y="130" text-anchor="middle" fill="white" font-size="13">月1,056円〜 ★30日無料トライアルあり</text>

  <!-- Pro版項目 -->
  <text x="450" y="165" fill="#1e293b" font-size="13" font-weight="bold">テキスト翻訳</text>
  <text x="450" y="183" fill="#22c55e" font-size="12">✓ 月100万文字（Advanced〜は無制限）</text>
  <line x1="440" y1="195" x2="770" y2="195" stroke="#e2e8f0" stroke-width="1"/>

  <text x="450" y="215" fill="#1e293b" font-size="13" font-weight="bold">ファイル翻訳</text>
  <text x="450" y="233" fill="#22c55e" font-size="12">✓ 月5件以上・PDF完全対応</text>
  <line x1="440" y1="245" x2="770" y2="245" stroke="#e2e8f0" stroke-width="1"/>

  <text x="450" y="265" fill="#1e293b" font-size="13" font-weight="bold">データプライバシー</text>
  <text x="450" y="283" fill="#22c55e" font-size="12">✓ 即時削除・学習利用なし</text>
  <line x1="440" y1="295" x2="770" y2="295" stroke="#e2e8f0" stroke-width="1"/>

  <text x="450" y="315" fill="#1e293b" font-size="13" font-weight="bold">用語集（専門用語統一）</text>
  <text x="450" y="333" fill="#22c55e" font-size="12">✓ 最大2,000件（Advanced以上）</text>
  <line x1="440" y1="345" x2="770" y2="345" stroke="#e2e8f0" stroke-width="1"/>

  <text x="450" y="365" fill="#f97316" font-size="12" font-weight="bold">→ 30日間無料で全機能が使える</text>

  <!-- フッター -->
  <text x="400" y="392" text-anchor="middle" fill="#94a3b8" font-size="10">AI navi (ai-navi.app) | 2026年最新情報</text>
</svg>
