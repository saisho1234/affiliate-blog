<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <rect width="800" height="520" fill="#f8fafc" rx="16"/>
  <rect x="0" y="0" width="800" height="72" fill="#2563eb" rx="16"/>
  <rect x="0" y="56" width="800" height="16" fill="#2563eb"/>
  <text x="400" y="44" text-anchor="middle" fill="white" font-size="22" font-weight="bold">生成AIスクール 料金・期間・給付金 早見表</text>

  <!-- ヘッダー行 -->
  <rect x="24" y="88" width="752" height="36" fill="#1e293b" rx="8"/>
  <text x="40" y="112" fill="white" font-size="13" font-weight="bold">スクール</text>
  <text x="232" y="112" fill="white" font-size="13" font-weight="bold">料金（税込）</text>
  <text x="400" y="112" fill="white" font-size="13" font-weight="bold">期間</text>
  <text x="510" y="112" fill="white" font-size="13" font-weight="bold">給付金</text>
  <text x="652" y="112" fill="white" font-size="13" font-weight="bold">向く人</text>

  <!-- 1 DMM -->
  <rect x="24" y="134" width="752" height="78" fill="white" rx="10" stroke="#dbeafe" stroke-width="2"/>
  <text x="40" y="164" fill="#1e293b" font-size="14" font-weight="bold">DMM 生成AI CAMP</text>
  <text x="40" y="184" fill="#64748b" font-size="12">学び放題（約1,500レッスン）</text>
  <text x="232" y="164" fill="#1e293b" font-size="13" font-weight="bold">月16,280円</text>
  <text x="232" y="184" fill="#64748b" font-size="11">12ヶ月一括162,800円</text>
  <text x="400" y="164" fill="#1e293b" font-size="13">月額は縛りなし</text>
  <text x="400" y="184" fill="#64748b" font-size="11">6/12ヶ月一括あり</text>
  <text x="510" y="164" fill="#ef4444" font-size="13" font-weight="bold">個人は対象外</text>
  <text x="510" y="184" fill="#64748b" font-size="11">法人は助成金の案内あり</text>
  <text x="652" y="164" fill="#1e293b" font-size="12">まず幅広く</text>
  <text x="652" y="184" fill="#1e293b" font-size="12">試したい人</text>

  <!-- 2 キカガク -->
  <rect x="24" y="222" width="752" height="78" fill="#f0fdf4" rx="10" stroke="#22c55e" stroke-width="2"/>
  <text x="40" y="252" fill="#1e293b" font-size="14" font-weight="bold">キカガク 長期コース</text>
  <text x="40" y="272" fill="#64748b" font-size="12">Python・機械学習・LLM</text>
  <text x="232" y="252" fill="#1e293b" font-size="13" font-weight="bold">792,000円</text>
  <text x="232" y="272" fill="#64748b" font-size="11">給付金で実質負担減</text>
  <text x="400" y="252" fill="#1e293b" font-size="13">6ヶ月 / 8ヶ月</text>
  <text x="510" y="252" fill="#16a34a" font-size="13" font-weight="bold">専門実践の対象</text>
  <text x="510" y="272" fill="#64748b" font-size="11">最大80%（年64万円上限）</text>
  <text x="652" y="252" fill="#1e293b" font-size="12">AI人材へ</text>
  <text x="652" y="272" fill="#1e293b" font-size="12">転職したい人</text>

  <!-- 3 デジハリ -->
  <rect x="24" y="310" width="752" height="78" fill="white" rx="10" stroke="#dbeafe" stroke-width="2"/>
  <text x="40" y="340" fill="#1e293b" font-size="14" font-weight="bold">デジハリ・オンライン</text>
  <text x="40" y="360" fill="#64748b" font-size="12">Adobeマスター講座</text>
  <text x="232" y="340" fill="#1e293b" font-size="13" font-weight="bold">68,800円</text>
  <text x="232" y="360" fill="#64748b" font-size="11">Adobe CC 1年分付き</text>
  <text x="400" y="340" fill="#1e293b" font-size="13">3ヶ月</text>
  <text x="510" y="340" fill="#64748b" font-size="13" font-weight="bold">記載なし</text>
  <text x="652" y="340" fill="#1e293b" font-size="12">デザインで</text>
  <text x="652" y="360" fill="#1e293b" font-size="12">生成AIを使う人</text>

  <!-- 4 AI Agent CAMP -->
  <rect x="24" y="398" width="752" height="78" fill="white" rx="10" stroke="#dbeafe" stroke-width="2"/>
  <text x="40" y="428" fill="#1e293b" font-size="14" font-weight="bold">AI Agent CAMP</text>
  <text x="40" y="448" fill="#64748b" font-size="12">Claude Code・Cursor特化</text>
  <text x="232" y="428" fill="#64748b" font-size="13">公式で確認</text>
  <text x="400" y="428" fill="#64748b" font-size="13">公式で確認</text>
  <text x="510" y="428" fill="#64748b" font-size="13" font-weight="bold">確認できず</text>
  <text x="652" y="428" fill="#1e293b" font-size="12">AIエージェントを</text>
  <text x="652" y="448" fill="#1e293b" font-size="12">作る非エンジニア</text>

  <text x="400" y="504" text-anchor="middle" fill="#94a3b8" font-size="11">AI navi (ai-navi.app) | 2026年11月時点・各公式サイトより作成</text>
</svg>
