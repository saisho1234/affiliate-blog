  <text x="495" y="363" text-anchor="middle" fill="#1e293b" font-size="12">レポート中心</text>
  <text x="680" y="344" text-anchor="middle" fill="#1e293b" font-size="12">スライド・シート</text>
  <text x="680" y="363" text-anchor="middle" fill="#1e293b" font-size="12">ドキュメントなど</text>

