<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <rect width="800" height="480" fill="#f8fafc" rx="16"/>
  <rect x="0" y="0" width="800" height="72" fill="#2563eb" rx="16"/>
