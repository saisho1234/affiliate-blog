  <text x="680" y="422" text-anchor="middle" fill="#1e293b" font-size="12">任せたい人</text>

  <text x="400" y="464" text-anchor="middle" fill="#94a3b8" font-size="11">※円換算は1ドル150円の目安。料金・機能は変更されることがあります｜AI navi (ai-navi.app) 作成</text>
