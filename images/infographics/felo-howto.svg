  <text x="680" y="118" text-anchor="middle" fill="white" font-size="15" font-weight="bold">Genspark</text>

  <!-- rows -->
  <rect x="28" y="140" width="744" height="54" fill="white" rx="8" stroke="#e2e8f0"/>
