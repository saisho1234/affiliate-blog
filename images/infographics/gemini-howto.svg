<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <rect width="800" height="470" fill="#f8fafc" rx="16"/>
  <rect x="0" y="0" width="800" height="72" fill="#2563eb" rx="16"/>
  <rect x="0" y="56" width="800" height="16" fill="#2563eb"/>
  <text x="400" y="45" text-anchor="middle" fill="white" font-size="22" font-weight="bold">Geminiの始め方｜スマホとPCの手順</text>

  <!-- Smartphone column -->
  <rect x="24" y="92" width="364" height="300" fill="white" rx="12" stroke="#dbeafe" stroke-width="2"/>
  <rect x="24" y="92" width="364" height="44" fill="#0891b2" rx="12"/>
  <rect x="24" y="120" width="364" height="16" fill="#0891b2"/>
  <text x="206" y="121" text-anchor="middle" fill="white" font-size="16" font-weight="bold">スマホ（iPhone / Android）</text>

  <circle cx="60" cy="172" r="18" fill="#0891b2"/>
  <text x="60" y="178" text-anchor="middle" fill="white" font-size="16" font-weight="bold">1</text>
  <text x="90" y="168" fill="#1e293b" font-size="14" font-weight="bold">公式「Gemini」アプリを入れる</text>
  <text x="90" y="186" fill="#64748b" font-size="12">App Store / Google Play で検索</text>

  <circle cx="60" cy="234" r="18" fill="#0891b2"/>
  <text x="60" y="240" text-anchor="middle" fill="white" font-size="16" font-weight="bold">2</text>
  <text x="90" y="230" fill="#1e293b" font-size="14" font-weight="bold">Googleアカウントでログイン</text>
  <text x="90" y="248" fill="#64748b" font-size="12">Gmailと同じアカウントでOK</text>

  <circle cx="60" cy="296" r="18" fill="#0891b2"/>
  <text x="60" y="302" text-anchor="middle" fill="white" font-size="16" font-weight="bold">3</text>
  <text x="90" y="292" fill="#1e293b" font-size="14" font-weight="bold">文字・音声・写真で質問</text>
  <text x="90" y="310" fill="#64748b" font-size="12">マイクやカメラから入力できる</text>

  <rect x="44" y="336" width="324" height="40" fill="#ecfeff" rx="8"/>
  <text x="206" y="361" text-anchor="middle" fill="#0e7490" font-size="12" font-weight="bold">外出先の調べもの・写真の質問に向く</text>

  <!-- PC column -->
  <rect x="412" y="92" width="364" height="300" fill="white" rx="12" stroke="#dbeafe" stroke-width="2"/>
  <rect x="412" y="92" width="364" height="44" fill="#7c3aed" rx="12"/>
  <rect x="412" y="120" width="364" height="16" fill="#7c3aed"/>
  <text x="594" y="121" text-anchor="middle" fill="white" font-size="16" font-weight="bold">PC（ブラウザ）</text>

  <circle cx="448" cy="172" r="18" fill="#7c3aed"/>
  <text x="448" y="178" text-anchor="middle" fill="white" font-size="16" font-weight="bold">1</text>
  <text x="478" y="168" fill="#1e293b" font-size="14" font-weight="bold">gemini.google.com を開く</text>
  <text x="478" y="186" fill="#64748b" font-size="12">Chrome・Edge・Safariなどで可</text>

  <circle cx="448" cy="234" r="18" fill="#7c3aed"/>
  <text x="448" y="240" text-anchor="middle" fill="white" font-size="16" font-weight="bold">2</text>
  <text x="478" y="230" fill="#1e293b" font-size="14" font-weight="bold">右上からログイン</text>
  <text x="478" y="248" fill="#64748b" font-size="12">未ログインでも一部機能は使える</text>

  <circle cx="448" cy="296" r="18" fill="#7c3aed"/>
  <text x="448" y="302" text-anchor="middle" fill="white" font-size="16" font-weight="bold">3</text>
  <text x="478" y="292" fill="#1e293b" font-size="14" font-weight="bold">入力欄に指示を書いて送信</text>
  <text x="478" y="310" fill="#64748b" font-size="12">ファイルのアップロードも可</text>

  <rect x="432" y="336" width="324" height="40" fill="#f5f3ff" rx="8"/>
  <text x="594" y="361" text-anchor="middle" fill="#6d28d9" font-size="12" font-weight="bold">長文の作成・資料の要約に向く</text>

  <text x="400" y="420" text-anchor="middle" fill="#475569" font-size="13">同じGoogleアカウントなら、スマホとPCで会話履歴を引き継げる</text>
  <text x="400" y="450" text-anchor="middle" fill="#94a3b8" font-size="11">AI navi (ai-navi.app) | 2026年11月時点の情報</text>
</svg>
