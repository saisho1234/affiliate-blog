<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 912" width="800" height="912" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
<rect width="800" height="912" fill="#f8fafc" rx="16"/>
<rect x="0" y="0" width="800" height="84" fill="#ea580c" rx="16"/><rect x="0" y="68" width="800" height="16" fill="#ea580c"/>
<text x="400" y="52" text-anchor="middle" fill="white" font-size="32" font-weight="bold">AIと人の目で校正する6ステップ</text>
<rect x="28" y="108" width="744" height="112" fill="white" rx="12" stroke="#ffedd5" stroke-width="2"/>
<circle cx="75" cy="164" r="28" fill="#ea580c"/>
<text x="75" y="174" text-anchor="middle" fill="white" font-size="28" font-weight="bold">1</text>
<text x="122" y="160" fill="#1e293b" font-size="28" font-weight="bold">時間を置いて読み返す</text>
<text x="122" y="194" fill="#475569" font-size="24">数時間、できれば翌日に読むと客観的に見られる</text>
<rect x="28" y="234" width="744" height="112" fill="white" rx="12" stroke="#ffedd5" stroke-width="2"/>
<circle cx="75" cy="290" r="28" fill="#ea580c"/>
<text x="75" y="300" text-anchor="middle" fill="white" font-size="28" font-weight="bold">2</text>
<text x="122" y="286" fill="#1e293b" font-size="28" font-weight="bold">音読する</text>
<text x="122" y="320" fill="#475569" font-size="24">長い文・同じ言葉の繰り返し・リズムの悪さが分かる</text>
<rect x="28" y="360" width="744" height="112" fill="white" rx="12" stroke="#ffedd5" stroke-width="2"/>
<circle cx="75" cy="416" r="28" fill="#ea580c"/>
<text x="75" y="426" text-anchor="middle" fill="white" font-size="28" font-weight="bold">3</text>
<text x="122" y="412" fill="#1e293b" font-size="28" font-weight="bold">AI校正ツールで自動チェック</text>
<text x="122" y="446" fill="#475569" font-size="24">文賢・Shodoなど。指摘は一つずつ「直す／残す」を判断</text>
<rect x="28" y="486" width="744" height="112" fill="white" rx="12" stroke="#ffedd5" stroke-width="2"/>
<circle cx="75" cy="542" r="28" fill="#ea580c"/>
<text x="75" y="552" text-anchor="middle" fill="white" font-size="28" font-weight="bold">4</text>
<text x="122" y="538" fill="#1e293b" font-size="28" font-weight="bold">生成AIに読者視点のチェック</text>
<text x="122" y="572" fill="#475569" font-size="24">ChatGPT・Claudeに分かりにくい箇所を指摘してもらう</text>
<rect x="28" y="612" width="744" height="112" fill="white" rx="12" stroke="#ffedd5" stroke-width="2"/>
<circle cx="75" cy="668" r="28" fill="#ea580c"/>
<text x="75" y="678" text-anchor="middle" fill="white" font-size="28" font-weight="bold">5</text>
<text x="122" y="664" fill="#1e293b" font-size="28" font-weight="bold">構成・見出し・リンクを確認</text>
<text x="122" y="698" fill="#475569" font-size="24">見出し・導入文・リンク・alt・メタディスクリプション</text>
<rect x="28" y="738" width="744" height="112" fill="white" rx="12" stroke="#ffedd5" stroke-width="2"/>
<circle cx="75" cy="794" r="28" fill="#ea580c"/>
<text x="75" y="804" text-anchor="middle" fill="white" font-size="28" font-weight="bold">6</text>
<text x="122" y="790" fill="#1e293b" font-size="28" font-weight="bold">別のツールで最終チェック</text>
<text x="122" y="824" fill="#475569" font-size="24">無料のEnnoなどで誤字脱字をもう一度確認</text>
<text x="400" y="888" text-anchor="middle" fill="#94a3b8" font-size="24">AI navi (ai-navi.app)｜記事本文の内容をもとに作成</text>
</svg>
